name: DevSecOps Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        
    - name: Run Pytest
      run: |
        pytest
        
    - name: Build Docker Image
      run: docker build -t vulnpilot:test .
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'vulnpilot:test'
        format: 'json'
        output: 'trivy-results.json'
        
    - name: VulnPilot Policy Enforcement
      run: |
        vulnpilot scan trivy-results.json --policy-file policies/pipeline-policy.yaml
