apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnpilot-api
  labels:
    app: vulnpilot
    version: "0.2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vulnpilot
  template:
    metadata:
      labels:
        app: vulnpilot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: vulnpilot:0.2.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: vulnpilot-secrets
              key: openai-api-key
              optional: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: policies
          mountPath: /app/policies
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: policies
        configMap:
          name: vulnpilot-policies
---
apiVersion: v1
kind: Service
metadata:
  name: vulnpilot-service
spec:
  selector:
    app: vulnpilot
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vulnpilot-netpol
spec:
  podSelector:
    matchLabels:
      app: vulnpilot
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: TCP
          port: 443  # Allow HTTPS outbound for LLM API only
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vulnpilot-sa
automountServiceAccountToken: false
